<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Abbas El Shabasy, MBA">
<meta property="og:description" content="Corporate Director of Information & Technology. 25+ years of hospitality IT across Egypt, Tanzania, Greece, Morocco, Saudi Arabia and Turkey.">
<meta property="og:type" content="profile">
<meta property="og:url" content="https://abbaselshabasy.github.io/">
<meta property="og:image" content="https://abbaselshabasy.github.io/photo.jpg">
<title>Abbas El Shabasy</title>
<meta name="description" content="Abbas El Shabasy, MBA. Corporate Director of Information & Technology in hospitality.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one calm column, sticky nav, sea-glass teal accent; the opening ledger and career rail carry the subject. */
:root {
  --bg: #F2F6F6;
  --surface: #FFFFFF;
  --ink: #14262B;
  --muted: #566C71;
  --line: #D4E0E1;
  --accent: #1D6A73;
  --accent-ink: #FFFFFF;
  --accent-soft: #DFEDEE;
  --sand: #9A7A3E;
  --display: "Bricolage Grotesque", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --body: "IBM Plex Sans", "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --step-0: 1rem;
  --step-1: 1.2rem;
  --step-2: 1.55rem;
  --step-3: clamp(1.9rem, 4vw, 2.6rem);
  --step-4: clamp(2.4rem, 7vw, 4.4rem);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1618; --surface: #142124; --ink: #E2ECEC; --muted: #93A8AB; --line: #24373A;
    --accent: #6CC0C7; --accent-ink: #0D1618; --accent-soft: #17323A; --sand: #D2B57A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1618; --surface: #142124; --ink: #E2ECEC; --muted: #93A8AB; --line: #24373A;
  --accent: #6CC0C7; --accent-ink: #0D1618; --accent-soft: #17323A; --sand: #D2B57A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 72px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: var(--step-0); line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
html[lang="ar"] body { line-height: 1.85; }
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 720px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3 { letter-spacing: 0; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

/* Nav */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar .wrap { display: flex; align-items: center; gap: 16px; min-height: 60px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.05rem; color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand span { color: var(--accent); }
.nav { flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav ul { display: flex; gap: 4px; list-style: none; margin: 0; padding: 0; }
.nav a { display: block; padding: 6px 10px; border-radius: 8px; color: var(--muted); text-decoration: none; font-size: 0.92rem; white-space: nowrap; }
.nav a:hover { color: var(--ink); background: var(--accent-soft); }
.lang-switch { flex: none; display: flex; border: 1px solid var(--accent); border-radius: 999px; padding: 2px; gap: 2px; direction: ltr; }
.lang-switch button {
  font: 600 0.82rem var(--body); cursor: pointer; border: 0; border-radius: 999px;
  color: var(--accent); background: transparent; padding: 5px 11px; min-width: 40px;
}
.lang-switch button:hover { background: var(--accent-soft); }
.lang-switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
@media (max-width: 420px) { .lang-switch button { padding: 5px 7px; min-width: 32px; } .brand { font-size: 0.95rem; } }
html[lang="de"] .stat span, html[lang="de"] .skill-group h3, html[lang="de"] .program h3 { hyphens: auto; overflow-wrap: break-word; }
@media (max-width: 640px) { .nav { display: none; } .topbar .wrap { justify-content: space-between; } }

/* Hero */
.hero { padding-block: 64px 40px; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: center; }
.status { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--accent); background: var(--accent-soft); padding: 4px 12px; border-radius: 999px; font-weight: 500; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.hero h1 { font-size: var(--step-4); line-height: 1.02; margin-top: 18px; font-weight: 700; }
.hero h1 small { display: inline-block; font-size: 0.35em; font-family: var(--mono); color: var(--sand); vertical-align: super; margin-inline-start: 8px; letter-spacing: 0.06em; }
.role { font-size: var(--step-1); font-weight: 600; margin-top: 10px; }
.lede { color: var(--muted); font-size: 1.12rem; max-width: 58ch; margin-top: 14px; }
.focus { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 18px; color: var(--muted); font-size: 0.9rem; }
.focus span + span::before { content: "·"; margin-inline-end: 14px; color: var(--line); }
.cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 20px; border-radius: 10px; font-weight: 600; text-decoration: none; font-size: 0.95rem; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { border: 1px solid var(--line); color: var(--ink); background: var(--surface); }
.btn:hover { filter: brightness(1.06); }
.portrait { width: 220px; aspect-ratio: 1; max-width: 100%; border-radius: 50%; padding: 6px; background: conic-gradient(from 200deg, var(--accent), var(--accent-soft), var(--sand), var(--accent)); }
.portrait img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; border: 4px solid var(--bg); }
@media (max-width: 760px) {
  .hero { padding-block: 36px 24px; }
  .hero-grid { grid-template-columns: 1fr; gap: 24px; }
  .portrait { order: -1; width: 128px; }
}

/* Stats */
.stats { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); border-block: 1px solid var(--line); margin-top: 8px; }
.stat { padding: 20px 16px; border-inline-start: 1px solid var(--line); }
.stat:first-child { border-inline-start: 0; padding-inline-start: 0; }
.stat b { display: block; font-family: var(--display); font-size: 1.9rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 0.85rem; line-height: 1.4; display: block; margin-top: 4px; }
@media (max-width: 1000px) {
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stat { border-inline-start: 0; border-top: 1px solid var(--line); padding-inline: 0 12px; }
  .stat:nth-child(-n+3) { border-top: 0; }
}
@media (max-width: 560px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3) { border-top: 1px solid var(--line); }
}

/* Sections */
section.block { padding-block: 72px 8px; }
.eyebrow { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
html[lang="ar"] .eyebrow { font-family: var(--body); letter-spacing: 0; font-size: 0.9rem; font-weight: 600; }
.block h2 { font-size: var(--step-3); margin-top: 6px; }
.section-intro { color: var(--muted); max-width: 62ch; margin-top: 10px; }
.block-body { margin-top: 32px; }

/* About */
.about-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; }
.about-grid > * { min-width: 0; }
.about-text p { font-size: 1.08rem; max-width: 62ch; }
.impact { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 14px; }
.impact li { padding-inline-start: 22px; position: relative; color: var(--ink); }
.impact li::before { content: ""; position: absolute; inset-inline-start: 0; top: 0.7em; width: 10px; height: 2px; background: var(--accent); }
.value { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; align-self: start; }
.value h3 { font-size: 1.05rem; }
.value ul { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 0; }
.value li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; }
.value li:first-child { border-top: 0; }
.value li i { font-style: normal; font-family: var(--mono); font-size: 0.75rem; color: var(--sand); }
@media (max-width: 760px) { .about-grid { grid-template-columns: 1fr; gap: 28px; } }

/* Experience timeline */
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ""; position: absolute; top: 8px; bottom: 8px; inset-inline-start: 150px; width: 1px; background: var(--line); }
.job { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 0 32px; padding-block: 18px; position: relative; }
.job::after { content: ""; position: absolute; inset-inline-start: 145px; top: 26px; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
.job.current::after { background: var(--accent); }
.job time { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); padding-top: 4px; font-variant-numeric: tabular-nums; direction: ltr; text-align: start; }
html[lang="ar"] .job time { text-align: right; }
.job-body { padding-inline-start: 4px; }
.job h3 { font-size: 1.15rem; line-height: 1.35; }
.job .org { color: var(--accent); font-weight: 500; font-size: 0.95rem; margin-top: 2px; }
.job p { color: var(--muted); margin-top: 8px; max-width: 66ch; }
@media (max-width: 640px) {
  .timeline::before { inset-inline-start: 5px; }
  .job { grid-template-columns: 1fr; padding-inline-start: 28px; }
  .job::after { inset-inline-start: 0; top: 24px; }
}

/* Skills */
.skills { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.skill-group { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
.skill-group h3 { font-size: 1rem; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { font-size: 0.85rem; padding: 4px 10px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); direction: ltr; unicode-bidi: isolate; }
@media (max-width: 900px) { .skills { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .skills { grid-template-columns: 1fr; } }
.langs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
.lang-item { border-top: 2px solid var(--accent); padding-top: 10px; }
.lang-item b { display: block; }
.lang-item span { color: var(--muted); font-size: 0.9rem; }
.meter { display: flex; gap: 4px; margin-top: 8px; }
.meter i { width: 22px; height: 4px; border-radius: 2px; background: var(--line); }
.meter i.on { background: var(--accent); }

/* Certifications */
.certs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; }
.cert-col h3 { font-family: var(--mono); font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
html[lang="ar"] .cert-col h3 { font-family: var(--body); letter-spacing: 0; font-size: 0.9rem; }
.cert-col ul { list-style: none; padding: 0; margin: 12px 0 0; }
.cert-col li { padding: 9px 0; border-top: 1px solid var(--line); font-weight: 500; direction: ltr; text-align: start; unicode-bidi: plaintext; }
.cert-col li .abbr { font-family: var(--display); font-weight: 700; font-size: 1.05rem; }
.edu { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 40px; }
.edu > div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; min-width: 0; }
.edu h3 { font-size: 1rem; }
.edu p { color: var(--muted); margin-top: 6px; font-size: 0.95rem; }
@media (max-width: 900px) { .certs { grid-template-columns: repeat(2, minmax(0, 1fr)); } .edu { grid-template-columns: 1fr; } }
@media (max-width: 480px) { .certs { grid-template-columns: 1fr; } }

/* Projects */
.programs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.program { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 8px; }
.program .tag { font-family: var(--mono); font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--sand); }
html[lang="ar"] .program .tag { font-family: var(--body); letter-spacing: 0; font-size: 0.82rem; }
.program h3 { font-size: 1.1rem; line-height: 1.3; }
.program p { color: var(--muted); font-size: 0.95rem; }
@media (max-width: 900px) { .programs { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .programs { grid-template-columns: 1fr; } }

.ledger-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; margin-top: 56px; }
.ledger-head h3 { font-size: 1.4rem; }
.ledger-head p { color: var(--muted); font-size: 0.95rem; }
.ledger { margin-top: 16px; border-top: 1px solid var(--ink); }
.ledger-row { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.ledger-row .yr { font-family: var(--mono); font-size: 0.95rem; color: var(--accent); font-variant-numeric: tabular-nums; }
.ledger-row ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 22px; }
.ledger-row li { direction: ltr; unicode-bidi: isolate; }
.ledger-row li em { font-style: normal; font-family: var(--mono); font-size: 0.8rem; color: var(--muted); margin-left: 6px; }
.ledger-row.pipeline { background: var(--accent-soft); border-radius: 0 0 var(--radius) var(--radius); padding-inline: 14px; border-bottom: 0; }
.ledger-row.pipeline .yr { font-weight: 500; }
@media (max-width: 560px) { .ledger-row { grid-template-columns: 1fr; gap: 4px; } }

/* Recommendations */
.quotes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.quote { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; gap: 14px; }
.quote .mark { font-family: var(--display); font-size: 2.6rem; line-height: 0.6; color: var(--accent); height: 20px; }
.quote p { color: var(--muted); font-style: italic; }
.quote footer { margin-top: auto; font-size: 0.88rem; }
.quote footer b { display: block; color: var(--ink); }
.quote footer span { color: var(--muted); }
.placeholder-tag { align-self: flex-start; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sand); border: 1px solid currentColor; border-radius: 4px; padding: 1px 6px; }
html[lang="ar"] .placeholder-tag { letter-spacing: 0; }
@media (max-width: 900px) { .quotes { grid-template-columns: 1fr; } }

/* Contact */
.contact { margin-block: 80px 0; background: var(--accent); color: var(--accent-ink); }
.contact .wrap { padding-block: 56px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: start; }
.contact h2 { font-size: var(--step-3); }
.contact .section-intro { color: inherit; opacity: 0.85; }
.contact .eyebrow { color: inherit; opacity: 0.8; }
.contact-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.contact-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 10px; background: color-mix(in srgb, var(--accent-ink) 10%, transparent); min-width: 0; }
.contact-list .k { font-size: 0.78rem; opacity: 0.8; display: block; }
.contact-list .v { font-weight: 600; user-select: all; direction: ltr; unicode-bidi: isolate; overflow-wrap: anywhere; }
.contact-list > li > div { min-width: 0; }
.copy { flex: none; font: 600 0.8rem var(--body); cursor: pointer; border: 1px solid currentColor; background: transparent; color: inherit; padding: 5px 12px; border-radius: 999px; }
.copy:hover { background: var(--accent-ink); color: var(--accent); }
@media (max-width: 760px) { .contact .wrap { grid-template-columns: 1fr; gap: 28px; } }
.foot { padding-block: 24px; color: var(--muted); font-size: 0.85rem; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
</style>
<style>body { margin: 0; } img { max-width: 100%; } [hidden] { display: none !important; }</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <a class="brand" href="#top">Abbas <span>El Shabasy</span></a>
    <nav class="nav" aria-label="Sections"><ul id="nav"></ul></nav>
    <div class="lang-switch" role="group" aria-label="Language / Langue / Sprache / اللغة">
      <button type="button" id="lang-en" data-lang="en" lang="en">EN</button>
      <button type="button" id="lang-fr" data-lang="fr" lang="fr">FR</button>
      <button type="button" id="lang-de" data-lang="de" lang="de">DE</button>
      <button type="button" id="lang-ar" data-lang="ar" lang="ar">عربي</button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div class="hero-grid">
        <div>
          <span class="status" data-i18n="status"></span>
          <h1><span data-i18n="name"></span><small>MBA</small></h1>
          <p class="role" data-i18n="role"></p>
          <p class="lede" data-i18n="lede"></p>
          <div class="focus" id="focus"></div>
          <div class="cta">
            <a class="btn btn-primary" href="#contact" data-i18n="ctaContact"></a>
            <a class="btn btn-ghost" href="#experience" data-i18n="ctaExp"></a>
          </div>
        </div>
        <div class="portrait"><img src="photo.jpg" alt="Abbas El Shabasy" width="520" height="520"></div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </section>

  <section class="block" id="about">
    <div class="wrap">
      <div class="eyebrow" data-i18n="navAbout"></div>
      <h2 data-i18n="aboutTitle"></h2>
      <div class="block-body about-grid">
        <div class="about-text">
          <p data-i18n="profile"></p>
          <ul class="impact" id="impact"></ul>
        </div>
        <aside class="value">
          <h3 data-i18n="valueTitle"></h3>
          <ul id="value"></ul>
        </aside>
      </div>
    </div>
  </section>

  <section class="block" id="experience">
    <div class="wrap">
      <div class="eyebrow" data-i18n="navExp"></div>
      <h2 data-i18n="expTitle"></h2>
      <p class="section-intro" data-i18n="expIntro"></p>
      <ol class="timeline block-body" id="timeline"></ol>
    </div>
  </section>

  <section class="block" id="skills">
    <div class="wrap">
      <div class="eyebrow" data-i18n="navSkills"></div>
      <h2 data-i18n="skillsTitle"></h2>
      <p class="section-intro" data-i18n="skillsIntro"></p>
      <div class="skills block-body" id="skillGroups"></div>
      <div class="langs" id="langs"></div>
    </div>
  </section>

  <section class="block" id="certifications">
    <div class="wrap">
      <div class="eyebrow" data-i18n="navCerts"></div>
      <h2 data-i18n="certsTitle"></h2>
      <div class="certs block-body" id="certs"></div>
      <div class="edu" id="edu"></div>
    </div>
  </section>

  <section class="block" id="projects">
    <div class="wrap">
      <div class="eyebrow" data-i18n="navProjects"></div>
      <h2 data-i18n="projectsTitle"></h2>
      <p class="section-intro" data-i18n="projectsIntro"></p>
      <div class="programs block-body" id="programs"></div>
      <div class="ledger-head">
        <h3 data-i18n="ledgerTitle"></h3>
        <p data-i18n="ledgerNote"></p>
      </div>
      <div class="ledger" id="ledger"></div>
    </div>

  const root = document.documentElement;
  root.lang = lang;
  root.dir = lang === "ar" ? "rtl" : "ltr";

    b.title = LANG_NAMES[b.dataset.lang];

  $("nav").innerHTML = NAV.map(([id, k]) => `<li><a href="#${id}">${esc(t(k))}</a></li>`).join("");
  $("focus").innerHTML = FOCUS.map(f => `<span>${esc(f[lang])}</span>`).join("");
  $("stats").innerHTML = STATS.map(([n, l]) => `<div class="stat"><b dir="ltr">${esc(n)}</b><span>${esc(l[lang])}</span></div>`).join("");
  $("impact").innerHTML = IMPACT.map(i => `<li>${esc(i[lang])}</li>`).join("");
  $("value").innerHTML = VALUE.map((v, i) => `<li><i>0${i + 1}</i><span>${esc(v[lang])}</span></li>`).join("");

  $("timeline").innerHTML = JOBS.map(j => `
    <li class="job${j.cur ? " current" : ""}">
      <time>${esc(j.y[lang])}</time>
      <div class="job-body">
        <h3>${esc(j.t[lang])}</h3>
        <div class="org" dir="auto">${esc(j.o)}</div>
        <p>${esc(j.d[lang])}</p>
      </div>
    </li>`).join("");

  $("skillGroups").innerHTML = SKILLS.map(([h, items]) => `
    <div class="skill-group"><h3>${esc(h[lang])}</h3>
      <div class="chips">${items.map(s => `<span class="chip">${esc(s)}</span>`).join("")}</div>
    </div>`).join("");
  $("langs").innerHTML = LANGS.map(([n, lv, score]) => `
    <div class="lang-item"><b>${esc(n[lang])}</b><span>${esc(lv[lang])}</span>
      <div class="meter" aria-hidden="true">${[1,2,3,4,5].map(i => `<i class="${i <= score ? "on" : ""}"></i>`).join("")}</div>
    </div>`).join("");

  $("certs").innerHTML = CERTS.map(([h, items]) => `
    <div class="cert-col"><h3>${esc(h[lang])}</h3>
      <ul>${items.map(c => `<li>${/^[A-Z ]+$/.test(c) ? `<span class="abbr">${esc(c)}</span>` : esc(c)}</li>`).join("")}</ul>
    </div>`).join("");
  $("edu").innerHTML = EDU.map(([h, p]) => `<div><h3>${esc(h[lang])}</h3><p>${esc(p[lang])}</p></div>`).join("");

  $("programs").innerHTML = PROGRAMS.map(([tag, h, p]) => `
    <article class="program"><span class="tag">${esc(tag[lang])}</span><h3>${esc(h[lang])}</h3><p>${esc(p[lang])}</p></article>`).join("");

  const roomsWord = { en: "rooms", fr: "chambres", de: "Zimmer", ar: "غرفة" }[lang];
  const inProgress = { en: "in progress", fr: "en cours", de: "in Umsetzung", ar: "قيد التنفيذ" }[lang];
  $("ledger").innerHTML = OPENINGS.map(([y, names]) => `
    <div class="ledger-row"><span class="yr">${esc(y || t("noYear"))}</span>
      <ul>${names.map(n => `<li>${esc(n)}</li>`).join("")}</ul></div>`).join("") + `
    <div class="ledger-row pipeline"><span class="yr">2026 · ${inProgress}</span>
      <ul>${PIPELINE.map(([n, r]) => `<li>${esc(n)}<em>${r} ${roomsWord}</em></li>`).join("")}</ul></div>`;

  $("quotes").innerHTML = QUOTES.map(([q, who, where]) => `
    <figure class="quote" style="margin:0">
      <span class="placeholder-tag">${esc(t("placeholder"))}</span>
      <div class="mark" aria-hidden="true">“</div>
      <p>${esc(q[lang])}</p>
      <footer><b>${esc(who[lang])}</b><span>${esc(where[lang])}</span></footer>
    </figure>`).join("");

  $("contactList").innerHTML = CONTACT.map(([k, v], i) => {
    const val = pick(v, lang);
    const copyable = i < 3;
    return `<li><div><span class="k">${esc(k[lang])}</span><span class="v">${esc(val)}</span></div>${
      copyable ? `<button type="button" class="copy" id="copy-${i}" data-v="${esc(val)}">${esc(t("copy"))}</button>` : ""}</li>`;
  }).join("");
  document.querySelectorAll(".copy").forEach(b => b.addEventListener("click", () => {
    const done = () => { b.textContent = t("copied"); setTimeout(() => { b.textContent = t("copy"); }, 1600); };
    const fallback = () => {
      const v = b.parentElement.querySelector(".v");
      const r = document.createRange(); r.selectNodeContents(v);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    };
    try { navigator.clipboard.writeText(b.dataset.v).then(done, fallback); } catch (e) { fallback(); }
  }));
}

const LANGS_OK = ["en", "fr", "de", "ar"];
let lang = "en";
try { lang = localStorage.getItem("cv-lang") || "en"; } catch (e) {}
const fromHash = location.hash.slice(1);
if (LANGS_OK.includes(fromHash)) lang = fromHash;
if (!LANGS_OK.includes(lang)) lang = "en";
render(lang);
document.querySelectorAll(".lang-switch button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("cv-lang", lang); } catch (e) {}
  render(lang);
}));
</script>

</body>
</html>
